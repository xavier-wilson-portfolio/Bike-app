name: Bike photos
# Downloads the licensed Wikimedia Commons photos listed in photos/wanted.json into photos/,
# with each photo's license and author in photos/meta.json. Runs only on the bike-photos branch,
# so nothing here touches the live site.
on:
  push:
    branches: [bike-photos]
    paths: [photos/wanted.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          UA = {"User-Agent": "RevoraGarage/1.0 (https://revoragarage.com; info@revoragarage.com)"}
          def get(url):
              for n in range(4):
                  try:
                      return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
                  except Exception as e:
                      time.sleep(3 * (n + 1)); err = e
              raise err
          os.makedirs("photos", exist_ok=True)
          want = json.load(open("photos/wanted.json"))
          meta = json.load(open("photos/meta.json")) if os.path.exists("photos/meta.json") else {}
          for w in want:
              pid, title = w["id"], w["file"]
              if meta.get(pid, {}).get("file") == title and os.path.exists(f"photos/{pid}.jpg"):
                  continue
              q = "https://commons.wikimedia.org/w/api.php?" + urllib.parse.urlencode({"action": "query", "format": "json", "prop": "imageinfo",
                  "iiprop": "url|extmetadata", "iiurlwidth": 2000, "titles": "File:" + title})
              page = list(json.loads(get(q))["query"]["pages"].values())[0]
              if "imageinfo" not in page:
                  print("missing", pid, title); continue
              ii = page["imageinfo"][0]; m = ii.get("extmetadata", {})
              lic = m.get("LicenseShortName", {}).get("value", "")
              if not re.search(r"CC BY|CC0|Public domain", lic, re.I):
                  print("skipped, license", pid, lic); continue
              open(f"photos/{pid}.jpg", "wb").write(get(ii.get("thumburl") or ii["url"]))
              meta[pid] = {"file": title, "page": ii["descriptionurl"], "lic": lic, "licUrl": m.get("LicenseUrl", {}).get("value", ""),
                           "artist": re.sub(r"<[^>]+>", "", m.get("Artist", {}).get("value", "")).strip()}
              print("ok", pid); time.sleep(1)
          json.dump(meta, open("photos/meta.json", "w"), indent=1, ensure_ascii=False)
          PY
      - name: Commit
        run: |
          git config user.name "revora-bot"
          git config user.email "info@revoragarage.com"
          git add photos
          git diff --cached --quiet || (git commit -m "Bike photos" && git push)
