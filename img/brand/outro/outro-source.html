<script>
const k=4.278606965174129,ox=101.44278606965179,oy=784.2139378446792,K=5.37243466244868,ix=282.12313620246334,iy=702.1231362024633;
const C=[47.2,47.5], A0=133, A1=390;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, eout=x=>{x=clamp(x);return 1-Math.pow(1-x,3)}, ein=x=>{x=clamp(x);return x*x*x};
const sweep=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const rad=a=>a*Math.PI/180, pt=(a,r)=>[C[0]+r*Math.cos(rad(a)),C[1]+r*Math.sin(rad(a))];
const RA=a=>a<337?29.4:29.4-2.2*clamp((a-337)/12);
function arcD(a0,a1,r){const p0=pt(a0,r),p1=pt(a1,r),large=(a1-a0)>180?1:0;return `M${p0[0]} ${p0[1]} A${r} ${r} 0 ${large} 1 ${p1[0]} ${p1[1]}`;}
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
const T={garOut:[0.45,0.35],abs0:0.45,absDur:0.42,stag:0.035,rMove:[0.45,0.62],swap:1.07,star:[1.07,0.55],acc:[1.55,0.22],hold:3.0};
window.render=t=>{
  // GARAGE out
  const g=eio((t-T.garOut[0])/T.garOut[1]); const G=document.getElementById('LG'); G.setAttribute('opacity',1-g); G.setAttribute('transform',`translate(0 ${g*4})`);
  ['e','v','o','r','a'].forEach((n,i)=>{const el=document.getElementById('L'+n), c=+el.dataset.c, p=ein((t-(T.abs0+i*T.stag))/T.absDur);
    const mm=eio((t-T.rMove[0])/T.rMove[1]), XX=540+(29.80+0.56-48)*K, rx=(XX-ox)/k*mm; const wg=document.getElementById('wg'); wg.setAttribute('x1',30+rx); wg.setAttribute('x2',42+rx); const dx=(24-c)*p+rx*p, s=1-0.8*p; el.setAttribute('transform',`translate(${c+dx} 50) scale(${s} ${s}) translate(${-c} -50)`); el.setAttribute('opacity',clamp(1-(p-0.8)/0.2)); });
  // R move
  const m=eio((t-T.rMove[0])/T.rMove[1]); const s0=k, s1=0.7964*K, X0=ox, Y0=oy, X1=540+(29.80+0.56-48)*K, Y1=960+(13.28+2-48)*K;
  const sc=s0, X=X0+(X1-X0)*m, Y=Y0;
  const wR=document.getElementById('wR'); wR.setAttribute('transform',`translate(${X} ${Y}) scale(${sc})`);
  const sw=clamp((t-T.swap)/0.15); 
  // star
  const f=sweep((t-T.star[0])/T.star[1]), a=A0+(A1-A0)*f, on=t>=T.star[0];
  document.getElementById('arcM').setAttribute('d', on&&f>0.001? arcD(A0-4,a,27):'');
  const hp=pt(a,RA(a)), head=document.getElementById('head'), core=document.getElementById('core');
  const fin=clamp((t-(T.star[0]+T.star[1]))/0.18), vis=on?(f<1?clamp(f*12):1-fin):0;
  head.setAttribute('cx',hp[0]);head.setAttribute('cy',hp[1]);core.setAttribute('cx',hp[0]);core.setAttribute('cy',hp[1]);
  head.setAttribute('opacity',0); core.setAttribute('opacity',0);
  // trail: short bright streak behind the head
  let tr=''; if(on&&vis>0){for(let i=1;i<=7;i++){const aa=a-i*3.2; if(aa<A0) break; const q=pt(aa,RA(aa)); tr+=`<circle cx="${q[0]}" cy="${q[1]}" r="${1.1-i*0.12}" fill="#ffffff" opacity="${(0.55-i*0.07)*vis}"/>`;}}
  document.getElementById('trail').innerHTML='';
  // sparks: small points shed along the path, drifting out and fading
  let sp=''; for(let i=0;i<22;i++){const ts=T.star[0]+0.08+i*(T.star[1]-0.1)/22, age=t-ts; if(age<0||age>0.7) continue;
    const ff=sweep((ts-T.star[0])/T.star[1]), aa=A0+(A1-A0)*ff, r=RA(aa)+ (rnd(i)-0.3)*2.2 + age*2.2*rnd(i+9), q=pt(aa-age*8,r);
    const o=(1-age/0.7)*(0.75*rnd(i+3)+0.25), rr=0.22+0.38*rnd(i+5)*(1-age/0.7); sp+=`<circle cx="${q[0]}" cy="${q[1]+age*1.5}" r="${rr}" fill="${rnd(i+7)>.5?'#ffffff':'#D9EAF4'}" opacity="${o}"/>`;}
  document.getElementById('spark').innerHTML='';
  // accent wipe on the R leg
  const ac=eout((t-T.acc[0])/T.acc[1]); document.getElementById('accR2').setAttribute('height',ac*20);
  // gentle settle of the whole mark
  const z=1;
  document.getElementById('icon').setAttribute('transform',`translate(${540-48*K*z} ${960-48*K*z}) scale(${K*z})`);
  if(z!==1){ const Xz=540+(X1-540)*z, Yz=960+(Y1-960)*z; if(m>=1) wR.setAttribute('transform',`translate(${Xz} ${Yz}) scale(${s1*z})`);}
  // fade in at start
  document.getElementById('s').style.opacity=clamp(t/0.25);
};
